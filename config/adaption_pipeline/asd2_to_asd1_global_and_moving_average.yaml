normalization_conditions:
  - original
  - anatomical
  - audio
  - anatomical_audio

anatomical_normalization:
  affine: true
  tps_after_affine: true
  vowel: u
  calibration_images:
    rows: 2
    columns: 4
    required_errors_mm: [annotation, affine, affine_tps]

audio_normalization:
  rms_target: 0.03
  vtln: true
  report_correlation_before_after: true
  primary_correlation_measurement: signed_target_reference_change
  signed_change_definition: correlation_after_vtln_minus_before_vtln
  contour_metrics_used_for_audio_correlation: false
  strict_same_number_and_session_order: true

evaluation:
  frame_pairing: exact
  coordinate_scale_mm: 1.62
  primary_metric: symmetric_p2cp_mm
  secondary_metric: coordinate_rmse_mm
  aggregate_after_per_frame_metric: true
  exclude_calibration_frame_from_primary: true

rendering:
  fps: 50
  synchronize_on: frame_id
  audio_track: original_once
  layouts:
    one_video: {rows: 1, columns: 1}
    two_video: {rows: 1, columns: 2}
    four_condition: {rows: 2, columns: 2}
    two_strategy_compare: {rows: 2, columns: 4}
    anatomical_diagnostic: {rows: 2, columns: 4}
